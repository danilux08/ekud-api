[project]
name = "ekud-api"
version = "0.1.0"
description = "REST API build for Ekud music app"
authors = [
    { name = "Danilux", email = "daniel.michele.deluca@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "ytmusicapi>=1.12.1",
]

[project.scripts]
ekud-api = "ekud_api:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "ekud_api.__init__:app"
